# Local Airflow + warehouse Postgres.
#
# Airflow metadata lives in database `airflow` on this Postgres container.
# Warehouse data (raw/staging/marts/pipeline_runs) lives in `aq_pipeline`.
#
# Airflow uses a custom image (pipeline/airflow/Dockerfile) with openaq + dbt.
# Repo paths are mounted at /opt/aq-pipeline for DAG task execution.
#
# DB_HOST is overridden to `postgres` for Airflow only — host scripts keep
# DB_HOST=localhost from .env via Makefile `include .env`.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: pipeline/airflow/Dockerfile
  image: aq-pipeline-airflow:2.9.3
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_REPO_ROOT: /opt/aq-pipeline
    DB_HOST: postgres
  volumes:
    - ./ingestion:/opt/aq-pipeline/ingestion
    - ./pipeline:/opt/aq-pipeline/pipeline
    - ./data/raw:/opt/aq-pipeline/data/raw
    - ./pipeline/dags:/opt/airflow/dags
    - ./pipeline/airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: aq-pipeline-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: aq-pipeline-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: aq-pipeline-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_WWW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: aq-pipeline-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
