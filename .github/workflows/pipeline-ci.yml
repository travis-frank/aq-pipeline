# CI for ingestion, pipeline (dbt), and API — throwaway Postgres only, never RDS.
name: pipeline-ci

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - "pipeline/**"
      - "api/**"
      - "pytest.ini"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    paths:
      - "ingestion/**"
      - "pipeline/**"
      - "api/**"
      - "pytest.ini"
      - ".github/workflows/pipeline-ci.yml"

env:
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: aq_pipeline
  DB_USER: aq_user
  DB_PASSWORD: ci_password
  # Dummy only — ingestion unit tests mock the OpenAQ SDK (no real API calls).
  OPENAQ_API_KEY: ci-dummy-openaq-api-key-not-used

jobs:
  test:
    name: ingestion + dbt + api
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aq_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: aq_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aq_user -d aq_pipeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            pipeline/requirements.txt
            api/requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt
          pip install -r pipeline/requirements.txt
          pip install -r api/requirements.txt

      - name: Run ingestion unit tests
        # test_openaq_client mocks OpenAQ; test_raw_storage mocks boto3 — no network.
        run: pytest ingestion/test_ingestion -q

      - name: Apply pipeline_runs migration
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f pipeline/migrations/001_pipeline_runs.sql

      - name: Create empty raw.openaq_pulls (dbt source)
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE TABLE IF NOT EXISTS raw.openaq_pulls (
              id          bigserial PRIMARY KEY,
              location_id bigint NOT NULL,
              pulled_at   timestamptz NOT NULL,
              raw_json    jsonb NOT NULL,
              UNIQUE (location_id, pulled_at)
          );
          SQL

      - name: Configure dbt profile
        run: cp pipeline/dbt/profiles.yml.example pipeline/dbt/profiles.yml

      - name: dbt debug
        working-directory: pipeline/dbt
        run: dbt debug --profiles-dir .

      - name: dbt run
        working-directory: pipeline/dbt
        run: dbt run --profiles-dir .

      - name: dbt test
        working-directory: pipeline/dbt
        run: dbt test --profiles-dir .

      # api/tests expect a real Postgres via DB_*. Some cases skip when marts /
      # pipeline_runs are empty; test_pipeline_runs_restored_after_empty_test
      # asserts count >= 1 after the empty_pipeline_runs fixture, so seed one row.
      - name: Seed pipeline_runs for API restore fixture
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO pipeline_runs (
              dag_run_ts, rows_ingested, rows_transformed,
              dbt_tests_run, dbt_tests_passed, duration_seconds, status
          ) VALUES (
              now(), 0, 0, 0, 0, 0, 'success'
          );
          SQL

      - name: Run API tests
        run: pytest api/tests -q
