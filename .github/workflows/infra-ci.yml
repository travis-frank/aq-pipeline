# CI for /infra: format, validate, and plan only. Never apply.
#
# Local Terraform state (no remote backend): plan always looks like a full create of the stack. That is expected; this job catches config errors, not an accurate diff vs live AWS.
#
# Required GitHub repository secrets (add these yourself before the job will pass):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# Optional:
#   AWS_REGION (defaults to us-east-1 below if unset as a variable)
name: infra-ci

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  # Dummy for plan only — never a real OpenAQ key. Required var has no default.
  TF_VAR_openaq_api_key: ci-dummy-openaq-api-key-not-for-apply

jobs:
  terraform:
    name: fmt + validate + plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # >= 1.9 required: variable validation may reference other variables
          # (public_subnet_cidrs / availability_zones checks in variables.tf).
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        # Intentionally no terraform apply; apply/destroy stays manual per demo.
        run: terraform plan -input=false -no-color
